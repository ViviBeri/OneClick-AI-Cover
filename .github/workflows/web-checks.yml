name: Web Checks

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-checks.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-checks.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
