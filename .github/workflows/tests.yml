name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install --only-binary=:all: -e . pytest
      - name: Verify CPU-only PyTorch after dependency installation
        run: python -c "import torch, torchaudio; assert torch.version.cuda is None, torch.version.cuda; assert torch.__version__.startswith('2.8.0'), torch.__version__; assert torchaudio.__version__.startswith('2.8.0'), torchaudio.__version__; print(f'CPU PyTorch {torch.__version__} and torchaudio {torchaudio.__version__} verified')"
      - name: Run tests
        run: python -m pytest -q
