name: Windows Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
      - name: Verify pinned CPU PyTorch
        run: python -c "import torch, torchaudio; assert torch.__version__.startswith('2.8.0'), torch.__version__; assert torchaudio.__version__.startswith('2.8.0'), torchaudio.__version__; assert torch.version.cuda is None, torch.version.cuda; print(f'CPU PyTorch {torch.__version__} and torchaudio {torchaudio.__version__} verified')"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile project sources
        run: python -m compileall -q app.py src tests scripts
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run real Demucs model inference smoke test
        if: matrix.python-version == '3.10'
        env:
          TORCH_HOME: ${{ runner.temp }}\\torch-cache
        run: python scripts/smoke_test_demucs.py
      - name: Download and verify pinned RVC inference assets
        if: matrix.python-version == '3.10'
        shell: pwsh
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          $rvcRoot = Join-Path $env:RUNNER_TEMP "rvc-assets"
          python scripts/download_rvc_assets.py --rvc-root $rvcRoot
          $required = @(
            "assets/hubert_base/config.json",
            "assets/hubert_base/preprocessor_config.json",
            "assets/hubert_base/pytorch_model.bin",
            "assets/rmvpe/rmvpe.pt"
          )
          foreach ($relative in $required) {
            $path = Join-Path $rvcRoot $relative
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing RVC inference asset: $relative" }
          }
      - name: Check core dependency imports and launch Gradio headlessly
        run: python scripts/smoke_test_app.py
      - name: Check Windows installer contract
        run: python scripts/check_installer_contract.py
      - name: Check required Windows setup files
        shell: pwsh
        run: |
          $required = @("install.bat", "run.bat", "app.py", "requirements.txt", "pyproject.toml", "docs/verification.md")
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required file: $path" }
          }
          Write-Host "Required Windows setup files are present."
