name: Windows Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-smoke-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip; python -m pip install -e . pytest
      - name: Compile project sources
        run: python -m compileall -q app.py src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Check required Windows setup files
        shell: pwsh
        run: |
          $required = @("install.bat", "run.bat", "app.py", "requirements.txt", "pyproject.toml")
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required file: $path" }
          }
          Write-Host "Required Windows setup files are present."
