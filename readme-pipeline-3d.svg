<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">OneClick AI Cover — animated isometric pipeline</title>
<desc id="desc">A decorative animated 3D isometric pipeline showing audio preparation, vocal separation, RVC voice conversion, mixing, and export. It does not represent live application telemetry.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b17"/><stop offset=".55" stop-color="#111b35"/><stop offset="1" stop-color="#29153b"/></linearGradient>
 <linearGradient id="topCyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
 <linearGradient id="topViolet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8b4fe"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
 <linearGradient id="topPink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fda4af"/><stop offset="1" stop-color="#db2777"/></linearGradient>
 <linearGradient id="topGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#253451"/><stop offset="1" stop-color="#111a2d"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#91a5dc" stroke-opacity=".10"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 text{font-family:Inter,Segoe UI,Arial,sans-serif}.float{transform-box:fill-box;transform-origin:center;animation:float 4.5s ease-in-out infinite}.floatB{transform-box:fill-box;transform-origin:center;animation:float 5.5s ease-in-out -1.5s infinite}.floatC{transform-box:fill-box;transform-origin:center;animation:float 4.9s ease-in-out -2.5s infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}.dash{stroke-dasharray:8 10;animation:dash 12s linear infinite}.wave{animation:wave 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes wave{from{transform:scaleY(.6)}to{transform:scaleY(1.25)}}
 @media(prefers-reduced-motion:reduce){.float,.floatB,.floatC,.pulse,.dash,.wave{animation:none}}
</style>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/><rect width="1200" height="420" rx="28" fill="url(#grid)"/>
<circle cx="910" cy="95" r="190" fill="#7c3aed" opacity=".14" filter="url(#blur)"/><circle cx="800" cy="370" r="170" fill="#06b6d4" opacity=".10" filter="url(#blur)"/>
<g opacity=".25" stroke="#7c8bb6" stroke-width="1"><path d="M470 35L1130 285M560 15L1200 255M455 95L1060 395M720 0L1190 185"/></g>
<g transform="translate(56 52)">
 <rect width="7" height="300" rx="3.5" fill="url(#topGold)"/>
 <text x="28" y="22" fill="#fcd34d" font-size="13" font-weight="700" letter-spacing="3.4">LOCAL AI AUDIO STUDIO</text>
 <text x="26" y="82" fill="#f8fafc" font-size="48" font-weight="800">OneClick</text><text x="26" y="134" fill="#f8fafc" font-size="48" font-weight="800">AI Cover</text>
 <text x="29" y="170" fill="#c5cee2" font-size="17">An open-source, local-first audio workflow.</text>
 <g transform="translate(28 196)"><rect width="112" height="30" rx="15" fill="#f59e0b" fill-opacity=".13" stroke="#fbbf24" stroke-opacity=".6"/><text x="56" y="19" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">LOCAL-FIRST</text><rect x="122" width="112" height="30" rx="15" fill="#22d3ee" fill-opacity=".1" stroke="#67e8f9" stroke-opacity=".6"/><text x="178" y="19" fill="#a5f3fc" font-size="10" font-weight="700" text-anchor="middle">OPEN SOURCE</text></g>
 <text x="29" y="263" fill="#9aa9c6" font-size="12" letter-spacing="1.4">PREPARE  →  SEPARATE  →  CONVERT</text><text x="29" y="283" fill="#9aa9c6" font-size="12" letter-spacing="1.4">MIX  →  EXPORT</text>
 <text x="29" y="324" fill="#64748b" font-size="10" letter-spacing="1.7">DECORATIVE ARTWORK · NOT LIVE STATUS</text>
</g>
<!-- illuminated path behind the isometric modules -->
<path d="M440 236L540 194L655 235L755 193L870 234L980 190L1085 230" fill="none" stroke="#67e8f9" stroke-width="3" opacity=".25" filter="url(#glow)"/>
<path class="dash" d="M440 236L540 194L655 235L755 193L870 234L980 190L1085 230" fill="none" stroke="#a5f3fc" stroke-width="2.2" opacity=".8"/>
<!-- each node is a small isometric 3D tile -->
<g class="float" transform="translate(424 188)">
 <path d="M0 24L54 0L108 24L54 49Z" fill="url(#topCyan)" stroke="#a5f3fc"/><path d="M0 24L54 49V94L0 69Z" fill="#123d56" stroke="#256b8a"/><path d="M54 49L108 24V69L54 94Z" fill="#102c4b" stroke="#256b8a"/>
 <g transform="translate(31 12)" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"><path d="M0 8V18M8 2V24M16 6V20M24 0V26M32 7V19M40 4V22"/></g>
 <text x="54" y="116" fill="#bae6fd" font-size="11" font-weight="700" text-anchor="middle">PREPARE</text>
</g>
<g class="floatB" transform="translate(554 145)">
 <path d="M0 24L54 0L108 24L54 49Z" fill="url(#topViolet)" stroke="#e9d5ff"/><path d="M0 24L54 49V94L0 69Z" fill="#3b2366" stroke="#8b5cf6"/><path d="M54 49L108 24V69L54 94Z" fill="#251b4a" stroke="#8b5cf6"/>
 <path d="M34 9L24 24L34 39M74 9L84 24L74 39M61 7L47 41" fill="none" stroke="#f5d0fe" stroke-width="3" stroke-linecap="round"/>
 <text x="54" y="116" fill="#e9d5ff" font-size="11" font-weight="700" text-anchor="middle">SEPARATE</text>
</g>
<g class="floatC" transform="translate(684 188)">
 <path d="M0 24L54 0L108 24L54 49Z" fill="url(#topPink)" stroke="#fecdd3"/><path d="M0 24L54 49V94L0 69Z" fill="#58213f" stroke="#fb7185"/><path d="M54 49L108 24V69L54 94Z" fill="#351a37" stroke="#fb7185"/>
 <circle cx="54" cy="22" r="13" fill="none" stroke="#fff1f2" stroke-width="2.5"/><path d="M49 14L65 22L49 30Z" fill="#fff1f2"/>
 <text x="54" y="116" fill="#fecdd3" font-size="11" font-weight="700" text-anchor="middle">RVC CONVERT</text>
</g>
<g class="float" transform="translate(814 145)">
 <path d="M0 24L54 0L108 24L54 49Z" fill="url(#topGold)" stroke="#fef3c7"/><path d="M0 24L54 49V94L0 69Z" fill="#60401a" stroke="#f59e0b"/><path d="M54 49L108 24V69L54 94Z" fill="#382819" stroke="#f59e0b"/>
 <g fill="#fef3c7"><rect x="27" y="17" width="4" height="11" rx="2"/><rect x="37" y="10" width="4" height="25" rx="2"/><rect x="47" y="5" width="4" height="35" rx="2"/><rect x="57" y="13" width="4" height="19" rx="2"/><rect x="67" y="8" width="4" height="28" rx="2"/><rect x="77" y="17" width="4" height="11" rx="2"/></g>
 <text x="54" y="116" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">MIX</text>
</g>
<g class="floatB" transform="translate(944 188)">
 <path d="M0 24L54 0L108 24L54 49Z" fill="#6ee7b7" stroke="#d1fae5"/><path d="M0 24L54 49V94L0 69Z" fill="#155747" stroke="#34d399"/><path d="M54 49L108 24V69L54 94Z" fill="#103c3a" stroke="#34d399"/>
 <path d="M35 12H65V33H35Z" fill="none" stroke="#ecfdf5" stroke-width="2"/><path d="M50 5V23M43 16L50 23L57 16" fill="none" stroke="#ecfdf5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="54" y="116" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">EXPORT</text>
</g>
<g class="pulse" filter="url(#glow)"><circle cx="539" cy="212" r="3" fill="#fef08a"/><circle cx="755" cy="211" r="3" fill="#67e8f9"/><circle cx="980" cy="209" r="3" fill="#c4b5fd"/></g>
</svg>