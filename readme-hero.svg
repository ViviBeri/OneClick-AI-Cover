<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">OneClick AI Cover — local AI audio studio</title>
<desc id="desc">Animated isometric 3D-style audio workstation showing the separate, convert, mix and export pipeline.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b18"/><stop offset=".55" stop-color="#111a32"/><stop offset="1" stop-color="#24143a"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2944"/><stop offset="1" stop-color="#101628"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="15"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8190c9" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif}.float{transform-box:fill-box;transform-origin:center;animation:float 5.5s ease-in-out infinite}.float2{transform-box:fill-box;transform-origin:center;animation:float2 6.5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.scan{animation:scan 4s linear infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-11px) rotate(1deg)}}@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@keyframes scan{0%{transform:translateX(-12px);opacity:.2}50%{opacity:1}100%{transform:translateX(12px);opacity:.2}}
</style>
<rect width="1200" height="520" rx="30" fill="url(#bg)"/>
<rect width="1200" height="520" rx="30" fill="url(#grid)"/>
<circle cx="1020" cy="80" r="230" fill="#a855f7" opacity=".12"/><circle cx="880" cy="440" r="230" fill="#06b6d4" opacity=".08"/>
<path d="M0 425L400 520H0Z" fill="#f59e0b" opacity=".08"/><path d="M800 0L1200 0V280Z" fill="#6366f1" opacity=".08"/>
<rect x="58" y="56" width="7" height="400" rx="4" fill="url(#gold)"/>
<text x="88" y="91" fill="#fcd34d" font-size="15" font-weight="700" letter-spacing="4">LOCAL AI AUDIO STUDIO</text>
<text x="86" y="163" fill="#f8fafc" font-size="49" font-weight="800">OneClick</text><text x="86" y="218" fill="#f8fafc" font-size="49" font-weight="800">AI Cover.</text>
<text x="89" y="260" fill="#c4cde1" font-size="19">Your audio. Your workflow. On your machine.</text>
<g transform="translate(88 298)"><rect width="120" height="34" rx="17" fill="#f59e0b" fill-opacity=".13" stroke="#fbbf24" stroke-opacity=".65"/><text x="60" y="22" fill="#fde68a" text-anchor="middle" font-size="12" font-weight="700">LOCAL-FIRST</text><rect x="132" width="106" height="34" rx="17" fill="#22d3ee" fill-opacity=".1" stroke="#67e8f9" stroke-opacity=".6"/><text x="185" y="22" fill="#a5f3fc" text-anchor="middle" font-size="12" font-weight="700">OPEN SOURCE</text></g>
<text x="89" y="389" fill="#9aa9c6" font-size="14">SEPARATE  →  CONVERT  →  MIX  →  EXPORT</text>
<text x="89" y="444" fill="#64748b" font-size="13" letter-spacing="2">WINDOWS-FIRST · EARLY INTEGRATION BUILD</text>
<!-- soft platform shadow -->
<ellipse cx="875" cy="415" rx="245" ry="42" fill="#000" opacity=".5" filter="url(#shadow)"/>
<!-- isometric floating workstation -->
<g class="float">
  <path d="M665 175L876 91L1111 180L900 266Z" fill="#283758" stroke="#7c8bb8" stroke-opacity=".7"/>
  <path d="M665 175L900 266V399L665 307Z" fill="#17243d" stroke="#334568"/>
  <path d="M900 266L1111 180V313L900 399Z" fill="#11182d" stroke="#334568"/>
  <path d="M665 307L900 399L1111 313L876 226Z" fill="#1b2742" opacity=".85"/>
  <g transform="translate(713 171) skewY(-19)">
    <rect width="355" height="183" rx="13" fill="url(#panel)" stroke="#64749b" stroke-width="1.5"/>
    <rect x="0" y="0" width="355" height="32" rx="13" fill="#263653"/>
    <rect x="0" y="19" width="355" height="13" fill="#263653"/>
    <circle cx="17" cy="16" r="4" fill="#fb7185"/><circle cx="31" cy="16" r="4" fill="#fbbf24"/><circle cx="45" cy="16" r="4" fill="#34d399"/>
    <text x="63" y="20" fill="#dbeafe" font-size="10" font-weight="700">ONECLICK AUDIO WORKSPACE</text>
    <rect x="15" y="45" width="325" height="47" rx="7" fill="#0b1223" stroke="#35415f"/>
    <text x="26" y="61" fill="#9fb2d3" font-size="9">INPUT TRACK</text>
    <g transform="translate(27 72)" fill="url(#cyan)"><rect x="0" y="-4" width="4" height="9" rx="2"/><rect x="8" y="-10" width="4" height="21" rx="2"/><rect x="16" y="-6" width="4" height="13" rx="2"/><rect x="24" y="-15" width="4" height="31" rx="2"/><rect x="32" y="-8" width="4" height="17" rx="2"/><rect x="40" y="-18" width="4" height="37" rx="2"/><rect x="48" y="-7" width="4" height="15" rx="2"/><rect x="56" y="-12" width="4" height="25" rx="2"/><rect x="64" y="-5" width="4" height="11" rx="2"/><rect x="72" y="-17" width="4" height="35" rx="2"/><rect x="80" y="-9" width="4" height="19" rx="2"/><rect x="88" y="-13" width="4" height="27" rx="2"/><rect x="96" y="-6" width="4" height="13" rx="2"/><rect x="104" y="-16" width="4" height="33" rx="2"/><rect x="112" y="-8" width="4" height="17" rx="2"/><rect x="120" y="-12" width="4" height="25" rx="2"/><rect x="128" y="-5" width="4" height="11" rx="2"/><rect x="136" y="-18" width="4" height="37" rx="2"/><rect x="144" y="-8" width="4" height="17" rx="2"/><rect x="152" y="-14" width="4" height="29" rx="2"/><rect x="160" y="-6" width="4" height="13" rx="2"/><rect x="168" y="-17" width="4" height="35" rx="2"/><rect x="176" y="-8" width="4" height="17" rx="2"/><rect x="184" y="-12" width="4" height="25" rx="2"/><rect x="192" y="-4" width="4" height="9" rx="2"/><rect x="200" y="-14" width="4" height="29" rx="2"/><rect x="208" y="-8" width="4" height="17" rx="2"/><rect x="216" y="-17" width="4" height="35" rx="2"/><rect x="224" y="-5" width="4" height="11" rx="2"/><rect x="232" y="-11" width="4" height="23" rx="2"/><rect x="240" y="-7" width="4" height="15" rx="2"/><rect x="248" y="-15" width="4" height="31" rx="2"/><rect x="256" y="-6" width="4" height="13" rx="2"/><rect x="264" y="-10" width="4" height="21" rx="2"/><rect x="272" y="-4" width="4" height="9" rx="2"/></g>
    <rect x="15" y="103" width="100" height="57" rx="7" fill="#171d35" stroke="#465071"/><rect x="127" y="103" width="100" height="57" rx="7" fill="#171d35" stroke="#465071"/><rect x="239" y="103" width="101" height="57" rx="7" fill="#171d35" stroke="#465071"/>
    <circle cx="65" cy="122" r="8" fill="url(#cyan)"/><path d="M61 117L70 122L61 127Z" fill="#0d1426"/>
    <path d="M163 116L174 122L163 128Z" fill="url(#pink)"/><path d="M159 116L148 122L159 128Z" fill="url(#pink)"/>
    <circle cx="289" cy="122" r="9" fill="url(#gold)"/><path d="M285 122L288 125L294 118" fill="none" stroke="#1f2937" stroke-width="2"/>
    <text x="65" y="146" text-anchor="middle" fill="#cbd5e1" font-size="9">SEPARATE</text><text x="177" y="146" text-anchor="middle" fill="#cbd5e1" font-size="9">CONVERT</text><text x="289" y="146" text-anchor="middle" fill="#cbd5e1" font-size="9">EXPORT</text>
  </g>
</g>
<!-- orbiting floating cards -->
<g class="float2"><g transform="translate(932 77)"><path d="M0 18L65 0L112 18L47 37Z" fill="#3a2a5d" stroke="#c084fc"/><path d="M0 18L47 37V64L0 45Z" fill="#271d44"/><path d="M47 37L112 18V45L47 64Z" fill="#1c1935"/><text x="54" y="30" fill="#e9d5ff" font-size="10" text-anchor="middle">RVC VOICE</text></g></g>
<g class="float2" style="animation-delay:-2s"><g transform="translate(1010 349)"><path d="M0 12L54 0L95 14L41 28Z" fill="#164454" stroke="#67e8f9"/><path d="M0 12L41 28V53L0 37Z" fill="#102b3d"/><path d="M41 28L95 14V39L41 53Z" fill="#0b2232"/><text x="47" y="25" fill="#a5f3fc" font-size="9" text-anchor="middle">WAV / MP3</text></g></g>
<g class="pulse" filter="url(#glow)"><circle cx="1080" cy="100" r="4" fill="#fcd34d"/><circle cx="641" cy="341" r="3" fill="#67e8f9"/><circle cx="1048" cy="430" r="3" fill="#c084fc"/></g>
</svg>