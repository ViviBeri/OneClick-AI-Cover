[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneclick-ai-cover"
version = "0.1.0"
description = "Local-first Windows AI voice-cover automation scaffold"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gradio>=6.16,<7",
  "demucs==4.0.1",
  "torch==2.13.0",
  "torchaudio==2.11.1",
  "numpy>=1.24,<2.0",
  "soundfile>=0.12.1",
  "imageio-ffmpeg>=0.4.9",
  "huggingface-hub>=0.27,<1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
